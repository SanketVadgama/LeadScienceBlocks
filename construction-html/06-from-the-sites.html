<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From the Sites</title>
  <link rel="stylesheet" href="06-from-the-sites.css" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
<section class="sites" id="sites">
  <div class="sites__inner">
    <div class="sites__header">
      <div>
        <p class="sites__eyebrow">Field Log</p>
        <h2 class="sites__title">From the sites.</h2>
      </div>
      <p class="sites__meta">2024 — 2026 · 48 projects</p>
    </div>
    <div class="sites__grid">
      <figure class="sites__fig" data-animate>
        <img src="https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1100&q=80" alt="Tower" loading="lazy" />
        <div class="sites__tint"></div>
        <div class="sites__cap"><span>Tower · Q3 2025</span><span class="sites__num">01</span></div>
      </figure>
      <figure class="sites__fig" data-animate>
        <img src="https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=1100&q=80" alt="Civic hall" loading="lazy" />
        <div class="sites__tint"></div>
        <div class="sites__cap"><span>Civic hall</span><span class="sites__num">02</span></div>
      </figure>
      <figure class="sites__fig" data-animate>
        <img src="https://images.unsplash.com/photo-1496564203457-11bb12075d90?auto=format&fit=crop&w=1100&q=80" alt="Industrial" loading="lazy" />
        <div class="sites__tint"></div>
        <div class="sites__cap"><span>Industrial fit-out</span><span class="sites__num">03</span></div>
      </figure>
      <figure class="sites__fig" data-animate>
        <img src="https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&w=1100&q=80" alt="Residential" loading="lazy" />
        <div class="sites__tint"></div>
        <div class="sites__cap"><span>Residential complex</span><span class="sites__num">04</span></div>
      </figure>
      <figure class="sites__fig" data-animate>
        <img src="https://images.unsplash.com/photo-1517089596392-fb9a9033e05b?auto=format&fit=crop&w=1100&q=80" alt="Site" loading="lazy" />
        <div class="sites__tint"></div>
        <div class="sites__cap"><span>Site, week 12</span><span class="sites__num">05</span></div>
      </figure>
      <figure class="sites__fig" data-animate>
        <img src="https://images.unsplash.com/photo-1590725140246-20acdee442be?auto=format&fit=crop&w=1100&q=80" alt="Crane" loading="lazy" />
        <div class="sites__tint"></div>
        <div class="sites__cap"><span>Crane lift</span><span class="sites__num">06</span></div>
      </figure>
      <figure class="sites__fig" data-animate>
        <img src="https://images.unsplash.com/photo-1605152276897-4f618f831968?auto=format&fit=crop&w=1100&q=80" alt="Interior" loading="lazy" />
        <div class="sites__tint"></div>
        <div class="sites__cap"><span>Interior shell</span><span class="sites__num">07</span></div>
      </figure>
      <figure class="sites__fig" data-animate>
        <img src="https://images.unsplash.com/photo-1473445730015-841f29a9490b?auto=format&fit=crop&w=1100&q=80" alt="Concrete" loading="lazy" />
        <div class="sites__tint"></div>
        <div class="sites__cap"><span>Concrete pour</span><span class="sites__num">08</span></div>
      </figure>
    </div>
  </div>
</section>
<script src="06-from-the-sites.js"></script>
</body>
</html>
