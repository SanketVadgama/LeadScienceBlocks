<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Crew</title>
  <link rel="stylesheet" href="05-the-crew.css" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
<section class="crew" id="crew">
  <div class="crew__inner">
    <p class="crew__eyebrow">LEADERSHIP</p>
    <h2 class="crew__title">THE CREW</h2>
    <div class="crew__grid">
      <div class="crew__card" data-animate>
        <div class="staff-portrait" style="--staff-ring:#F2A516">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80" alt="Daniel Reyes" loading="lazy" />
          <span class="staff-ring"></span>
          <div class="staff-tag"><p class="staff-tag__role">President</p></div>
          <div class="staff-badge">01</div>
        </div>
        <p class="crew__name">Daniel Reyes</p>
        <p class="crew__role">President</p>
      </div>
      <div class="crew__card" data-animate>
        <div class="staff-portrait" style="--staff-ring:#F2A516">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80" alt="Hannah Mitchell" loading="lazy" />
          <span class="staff-ring"></span>
          <div class="staff-tag"><p class="staff-tag__role">VP Operations</p></div>
          <div class="staff-badge">02</div>
        </div>
        <p class="crew__name">Hannah Mitchell</p>
        <p class="crew__role">VP Operations</p>
      </div>
      <div class="crew__card" data-animate>
        <div class="staff-portrait" style="--staff-ring:#F2A516">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80" alt="Wesley Cooper" loading="lazy" />
          <span class="staff-ring"></span>
          <div class="staff-tag"><p class="staff-tag__role">Director, Field Ops</p></div>
          <div class="staff-badge">03</div>
        </div>
        <p class="crew__name">Wesley Cooper</p>
        <p class="crew__role">Director, Field Ops</p>
      </div>
      <div class="crew__card" data-animate>
        <div class="staff-portrait" style="--staff-ring:#F2A516">
          <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=600&q=80" alt="Aisha Patel" loading="lazy" />
          <span class="staff-ring"></span>
          <div class="staff-tag"><p class="staff-tag__role">Chief Estimator</p></div>
          <div class="staff-badge">04</div>
        </div>
        <p class="crew__name">Aisha Patel</p>
        <p class="crew__role">Chief Estimator</p>
      </div>
    </div>
  </div>
</section>
<script src="05-the-crew.js"></script>
</body>
</html>
