<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specialties Section</title>
  <link rel="stylesheet" href="specialties-section.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- ========== SPECIALTIES SECTION ========== -->
  <section class="specialties" id="specialties">
    <!-- Decorative blobs -->
    <div class="specialties__blob specialties__blob--tl"></div>
    <div class="specialties__blob specialties__blob--br"></div>

    <div class="specialties__inner">
      <div class="specialties__header">
        <div>
          <span class="specialties__eyebrow">Specialties</span>
          <h2 class="specialties__title">Care, in focus.</h2>
        </div>
        <p class="specialties__subtitle">
          Hover any card — the spec sheet floats out from inside, framed in frosted glass.
        </p>
      </div>

      <div class="specialties__grid">
        <!-- Card 1 -->
        <article class="io-card">
          <img
            class="io-card__img"
            src="https://images.unsplash.com/photo-1551601651-2a8555f1a136?auto=format&fit=crop&w=900&q=80"
            alt="Heart & vascular"
          />
          <div class="io-card__data morph-glass">
            <span class="io-card__eyebrow">Cardiology</span>
            <h3 class="io-card__title">Heart &amp; vascular</h3>
            <a class="io-card__cta" href="#">Learn more →</a>
          </div>
        </article>

        <!-- Card 2 -->
        <article class="io-card">
          <img
            class="io-card__img"
            src="https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=900&q=80"
            alt="Skin clarity"
          />
          <div class="io-card__data morph-glass">
            <span class="io-card__eyebrow">Dermatology</span>
            <h3 class="io-card__title">Skin clarity</h3>
            <a class="io-card__cta" href="#">Learn more →</a>
          </div>
        </article>

        <!-- Card 3 -->
        <article class="io-card">
          <img
            class="io-card__img"
            src="https://images.unsplash.com/photo-1530497610245-94d3c16cda28?auto=format&fit=crop&w=900&q=80"
            alt="Children's health"
          />
          <div class="io-card__data morph-glass">
            <span class="io-card__eyebrow">Pediatrics</span>
            <h3 class="io-card__title">Children's health</h3>
            <a class="io-card__cta" href="#">Learn more →</a>
          </div>
        </article>

        <!-- Card 4 -->
        <article class="io-card">
          <img
            class="io-card__img"
            src="https://images.unsplash.com/photo-1505751172876-fa1923c5c528?auto=format&fit=crop&w=900&q=80"
            alt="OB/GYN care"
          />
          <div class="io-card__data morph-glass">
            <span class="io-card__eyebrow">Women's Health</span>
            <h3 class="io-card__title">OB/GYN care</h3>
            <a class="io-card__cta" href="#">Learn more →</a>
          </div>
        </article>
      </div>
    </div>
  </section>
  <!-- No JS required for this section (pure CSS hover) -->
</body>
</html>
